<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171B1B">
<title>Tamagotchi ovladač</title>
<style>
:root{--bg:#171B1B;--card:#222828;--text:#F0F3EF;--dim:#AEBAB2;--alt:#303838;--line:#414B48;--lime:#B5F36A;--on:#172016;--err:#FF8A80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;overflow:hidden}
h1{margin:0;font-size:22px;font-weight:700}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{opacity:.4;cursor:default}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;background:var(--bg);
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  transition:transform .28s ease,opacity .28s ease}
#scan{transform:translateX(100%);opacity:0;pointer-events:none}
.on-scan #scan{transform:none;opacity:1;pointer-events:auto}
.on-scan #home{transform:translateX(-24%);opacity:0;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dim)}
.pill.on::before{background:var(--lime);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(181,243,106,.6)}100%{box-shadow:0 0 0 10px rgba(181,243,106,0)}}
.face{width:128px;height:128px;margin:0 auto;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:68px}
.face.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.card{background:var(--card);border-radius:20px;padding:20px}
.title{font-weight:600}
.msg{color:var(--dim);font-size:13px;line-height:18px;margin:4px 0 16px;min-height:18px}
.msg.error{color:var(--err)}
.primary{width:100%;min-height:48px;border-radius:12px;background:var(--lime);color:var(--on);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{height:128px;padding:16px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;font-weight:600;transition:transform .1s,box-shadow .2s}
.mood span:first-child{font-size:40px;line-height:48px}
.mood:active:not(:disabled){transform:scale(.96)}
.mood.sent{box-shadow:inset 0 0 0 2px var(--lime)}
.icon{width:48px;height:48px;margin-left:-12px;font-size:32px;line-height:1}
.radar{position:relative;width:160px;height:160px;margin:32px auto;display:none}
.empty .radar{display:block}
.radar i{position:absolute;inset:0;border:2px solid var(--lime);border-radius:50%;opacity:0}
.scanning .radar i{animation:ring 2.4s ease-out infinite}
.radar i:nth-child(2){animation-delay:.8s}
.radar i:nth-child(3){animation-delay:1.6s}
.radar::after{content:"";position:absolute;inset:calc(50% - 8px);border-radius:50%;background:var(--lime)}
@keyframes ring{from{transform:scale(.1);opacity:.7}to{transform:scale(1);opacity:0}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.dev{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--card);cursor:pointer}
.dev.pet{box-shadow:inset 0 0 0 1px var(--lime)}
.dev.busy{opacity:.6}
.ico{width:44px;height:44px;border-radius:12px;background:var(--alt);display:grid;place-items:center;font-size:24px}
.info{flex:1;min-width:0}
.info b,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--dim);font-size:12px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.bars i{width:4px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:10px}.bars i:nth-child(3){height:15px}.bars i:nth-child(4){height:20px}
.lv-1 i:nth-child(-n+1),.lv-2 i:nth-child(-n+2),.lv-3 i:nth-child(-n+3),.lv-4 i{background:var(--lime)}
.chip{align-self:center;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--dim);font-size:13px}
.chip.on{background:var(--alt);color:var(--text)}
</style>
</head>
<body>
<div id="home" class="screen">
  <div class="top"><h1>Tamagotchi</h1><div id="status" class="pill off">Odpojeno</div></div>
  <div id="face" class="face">🥚</div>
  <section class="card">
    <div id="devname" class="title">Žádné zařízení</div>
    <p id="msg" class="msg">Najděte mazlíčka a vyberte náladu.</p>
    <button id="connect" class="primary">Najít mazlíčka</button>
  </section>
  <div id="grid" class="grid"></div>
</div>

<div id="scan" class="screen">
  <div class="top"><button id="back" class="icon" aria-label="Zpět">‹</button><h1 style="flex:1">Hledání zařízení</h1></div>
  <p id="scanmsg" class="msg"></p>
  <div class="radar"><i></i><i></i><i></i></div>
  <ul id="list" class="list"></ul>
  <button id="all" class="chip">Zobrazit všechna zařízení</button>
  <button id="rescan" class="primary">Hledat znovu</button>
</div>
<script src="app.js"></script>
</body>
</html>
